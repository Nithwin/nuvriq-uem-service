version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nuvriq_uem_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuvriq_uem
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nuvriq_uem"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
